# Shared workflow for independently installed TypeScript integrations.
name: TypeScript plugin

on:
  workflow_call:
    inputs:
      plugin:
        type: string
        required: true
      deps:
        type: string
        default: locked

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        env:
          PLUGIN: ${{ inputs.plugin }}
        run: python3 scripts/ci/matrix.py --plugin-dir "typescript/$PLUGIN" --github-output "$GITHUB_OUTPUT"

  test:
    name: ${{ inputs.plugin }} (${{ matrix.os }}, node${{ matrix.runtime }})
    needs: matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    env:
      PLUGIN_DIR: typescript/${{ inputs.plugin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.runtime }}
          cache: pnpm
          cache-dependency-path: typescript/${{ inputs.plugin }}/pnpm-lock.yaml
      - name: Install GNU make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y --no-progress
      - name: Sync dependencies
        env:
          DEPS: ${{ inputs.deps }}
        run: |
          cd "$PLUGIN_DIR"
          case "$DEPS" in
            locked) make sync ;;
            latest) make sync-latest ;;
            *) echo "::error::unknown deps mode '$DEPS'"; exit 1 ;;
          esac
      - name: Lint and test
        run: cd "$PLUGIN_DIR" && make lint && make test
      - name: Build and verify npm package
        if: matrix.dist
        run: |
          cd "$PLUGIN_DIR"
          make build
          python3 ../../scripts/ci/check_npm_package.py --plugin-dir .
          node ../_shared/smoke.mjs
